<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" fill="none" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="lensCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="60%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
    <radialGradient id="lensGlassDisc" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#e0f2fe" stop-opacity="0.7"/>
      <stop offset="85%" stop-color="#38bdf8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.8"/>
    </radialGradient>
    <linearGradient id="arGlint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <!-- Full Card Background Gradient -->
  <rect width="320" height="200" fill="url(#lensCardBg)" rx="16"/>

  <!-- Optical Wave Ripples in Background -->
  <circle cx="230" cy="110" r="110" stroke="#0ea5e9" stroke-width="1.5" stroke-opacity="0.2" stroke-dasharray="6 6"/>
  <circle cx="230" cy="110" r="85" stroke="#0284c7" stroke-width="2" stroke-opacity="0.25"/>

  <!-- Lens Graphic aligned toward right center -->
  <g transform="translate(230, 110)" opacity="0.85">
    <!-- Lens Disc -->
    <circle cx="0" cy="0" r="62" fill="url(#lensGlassDisc)" stroke="#0284c7" stroke-width="4"/>

    <!-- Anti-Reflective Coating Arc -->
    <path d="M -44,-30 A 55 55 0 0 1 44,-30" stroke="url(#arGlint)" stroke-width="5" stroke-linecap="round" fill="none"/>
    <path d="M -30,-18 A 44 44 0 0 1 30,-18" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.9"/>

    <!-- Crosshairs -->
    <line x1="-62" y1="0" x2="62" y2="0" stroke="#0284c7" stroke-width="1.5" stroke-opacity="0.4"/>
    <line x1="0" y1="-62" x2="0" y2="62" stroke="#0284c7" stroke-width="1.5" stroke-opacity="0.4"/>
    <circle cx="0" cy="0" r="8" stroke="#0284c7" stroke-width="2" stroke-opacity="0.6" fill="none"/>
    <circle cx="0" cy="0" r="3" fill="#0284c7"/>

    <!-- Highlights -->
    <ellipse cx="-22" cy="-26" rx="16" ry="8" transform="rotate(-30, -22, -26)" fill="#ffffff" fill-opacity="0.8"/>
    <ellipse cx="26" cy="28" rx="10" ry="5" transform="rotate(-30, 26, 28)" fill="#38bdf8" fill-opacity="0.6"/>
  </g>
</svg>
