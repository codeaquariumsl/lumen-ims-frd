<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" fill="none" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sgCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="60%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="sgTint" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#1e293b" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="sgGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- Full Card Background Gradient -->
  <rect width="320" height="200" fill="url(#sgCardBg)" rx="16"/>

  <g transform="translate(20, 52)" opacity="0.85">
    <!-- Top Browline Bar -->
    <path d="M 12,16 L 268,16" stroke="url(#sgGold)" stroke-width="4.5" stroke-linecap="round"/>

    <!-- Left Aviator Lens -->
    <path d="M 22,22 C 22,16 42,14 70,14 C 98,14 118,16 118,24 C 118,50 110,82 70,82 C 30,82 22,50 22,22 Z" fill="url(#sgTint)" stroke="url(#sgGold)" stroke-width="4.5" stroke-linejoin="round"/>
    <!-- Left Lens Glint -->
    <path d="M 36,26 L 58,16 M 44,52 L 88,18" stroke="#fef08a" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

    <!-- Bridge -->
    <path d="M 118,26 C 126,18 154,18 162,26" stroke="url(#sgGold)" stroke-width="4.5" fill="none" stroke-linecap="round"/>

    <!-- Right Aviator Lens -->
    <path d="M 162,24 C 162,16 182,14 210,14 C 238,14 258,16 258,22 C 258,50 250,82 210,82 C 170,82 162,50 162,24 Z" fill="url(#sgTint)" stroke="url(#sgGold)" stroke-width="4.5" stroke-linejoin="round"/>
    <!-- Right Lens Glint -->
    <path d="M 176,26 L 198,16 M 184,52 L 228,18" stroke="#fef08a" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

    <!-- Temple Hinges -->
    <circle cx="14" cy="18" r="4.5" fill="#b45309"/>
    <circle cx="266" cy="18" r="4.5" fill="#b45309"/>
  </g>
</svg>
